name: owlcms-tracker
run-name: owlcms-tracker - ${{ github.event.inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'semver number for the release'
        required: true
        default: '3.0.0-beta01'
      sourceRef:
        description: 'tracker branch or tag to build'
        required: true
        default: 'dev69'
      trackerCoreVersion:
        description: 'tracker-core tag to install'
        required: true
        default: '2.0.0-beta01'
      trackerCoreBranch:
        description: 'tracker-core branch that must contain the selected tag'
        required: true
        default: 'dev69'
      includeSubmodules:
        description: 'Include git submodules (e.g., books) in the build'
        required: true
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REVISION: ${{ github.event.inputs.revision }}
      SOURCE_REF: ${{ github.event.inputs.sourceRef }}
      TRACKER_CORE_VERSION: ${{ github.event.inputs.trackerCoreVersion }}
      TRACKER_CORE_BRANCH: ${{ github.event.inputs.trackerCoreBranch }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sourceRef }}
          submodules: ${{ inputs.includeSubmodules }}

      - name: Verify release sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          checked_out="$(git branch --show-current)"
          if [[ "${checked_out}" != "${SOURCE_REF}" ]]; then
            echo "❌ Expected tracker ref ${SOURCE_REF}, checked out ${checked_out:-detached HEAD}"
            exit 1
          fi

          comparison="$(gh api \
            "repos/owlcms/tracker-core/compare/${TRACKER_CORE_VERSION}...${TRACKER_CORE_BRANCH}" \
            --jq '.status')"
          if [[ "${comparison}" != "identical" && "${comparison}" != "ahead" ]]; then
            echo "❌ tracker-core tag ${TRACKER_CORE_VERSION} is not contained in branch ${TRACKER_CORE_BRANCH}"
            echo "GitHub comparison status: ${comparison}"
            exit 1
          fi

          echo "✓ tracker source: ${SOURCE_REF} ($(git rev-parse HEAD))"
          echo "✓ tracker-core ${TRACKER_CORE_VERSION} is on ${TRACKER_CORE_BRANCH}"

      - name: Fail if tag or release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Checking if tag/release already exists for: ${REVISION}"

          if git ls-remote --tags origin "refs/tags/${REVISION}" | grep -q .; then
            echo "❌ Git tag already exists on origin: ${REVISION}"
            echo "Stop: choose a new version or delete the tag/release manually (not recommended)."
            exit 1
          fi

          if gh release view "${REVISION}" >/dev/null 2>&1; then
            echo "❌ GitHub Release already exists: ${REVISION}"
            echo "Stop: choose a new version or manually manage the existing release assets."
            exit 1
          fi
          echo "✓ Tag and release do not exist yet"
      
      - name: Verify Docker Credentials
        run: |
          if [ -z "${{ secrets.DOCKER_USER }}" ]; then
            echo "❌ DOCKER_USER not found in repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "❌ DOCKER_TOKEN not found in repository secrets"
            exit 1
          fi
          echo "✅ Repository secrets retrieved successfully"
          echo "Docker Registry: ${{ vars.DOCKER_REG }}"
          echo "Docker Username: ${{ secrets.DOCKER_USER }}"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          echo "Installing dependencies from package-lock.json..."
          npm ci
          echo "✓ Dependencies installed"
          
          # Verify tracker-core version
          echo ""
          echo "📋 Checking @owlcms/tracker-core version:"
          npm list @owlcms/tracker-core
          installed_core="$(node -p "require('./node_modules/@owlcms/tracker-core/package.json').version")"
          if [[ "${installed_core}" != "${TRACKER_CORE_VERSION}" ]]; then
            echo "❌ Requested tracker-core ${TRACKER_CORE_VERSION}, installed ${installed_core}"
            exit 1
          fi
          echo "✓ Installed tracker-core ${installed_core}"
      
      - name: Clean experimental plugins
        run: |
          echo "Removing experimental plugins before build..."
          rm -rf src/plugins/experiments
          echo "✓ Experimental plugins removed"
      
      - name: Build universal package
        run: node scripts/build-zip.js "${{ env.REVISION }}" "${{ env.TRACKER_CORE_VERSION }}" --standard
      
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REG }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          pull: true
          build-args: |
            TRACKER_VERSION_OVERRIDE=${{ env.REVISION }}
            TRACKER_COMMIT=${{ github.sha }}
          tags: |
            ${{ vars.DOCKER_REG }}/owlcms/tracker:${{ env.REVISION }}
            ${{ vars.DOCKER_REG }}/owlcms/tracker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: owlcms-tracker
          path: dist/owlcms-tracker_${{ env.REVISION }}.zip
          retention-days: 90
      
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          # Re-check just before tagging/releasing (race condition safety)
          if git ls-remote --tags origin "refs/tags/${{ env.REVISION }}" | grep -q .; then
            echo "❌ Git tag already exists on origin: ${{ env.REVISION }}"
            exit 1
          fi
          if gh release view "${{ env.REVISION }}" >/dev/null 2>&1; then
            echo "❌ GitHub Release already exists: ${{ env.REVISION }}"
            exit 1
          fi

          # Tag the current commit
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          git tag ${{ env.REVISION }}
          git push origin ${{ env.REVISION }}
          
          # Create release with package and release notes
          # Use --target to avoid race condition where tag push hasn't propagated yet
          gh release create ${{ env.REVISION }} \
            --target "${{ github.sha }}" \
            --title "${{ env.REVISION }}" \
            --notes-file ReleaseNotes.md \
            dist/owlcms-tracker_${{ env.REVISION }}.zip
          set +x
